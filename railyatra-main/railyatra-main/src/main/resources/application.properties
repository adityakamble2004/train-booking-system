spring.application.name=railyatra-main
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/railyatra_main
spring.datasource.username=${DB_USER:railyatra}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.url.rewriteBatchedStatements=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.public-server.url=http://localhost:8080/api/v1

management.endpoints.web.exposure.include=health

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploy-32b!}
app.jwt.access-minutes=15
app.security.cookie-secure=false