$kind: http-request
url: "{{baseUrl}}/admin/journeys?trainNo={{trainNo}}"
method: GET
queryParams:
  trainNo: "{{trainNo}}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Journey list response", function () {
      pm.expect(pm.response.code).to.be.oneOf([200, 401, 403]); });
    language: text/javascript
order: 3000
