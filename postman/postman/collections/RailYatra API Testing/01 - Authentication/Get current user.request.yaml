$kind: http-request
url: "{{baseUrl}}/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Authenticated user response", function () { pm.expect(pm.response.code).to.be.oneOf([200, 401]); });
    language: text/javascript
order: 3000
