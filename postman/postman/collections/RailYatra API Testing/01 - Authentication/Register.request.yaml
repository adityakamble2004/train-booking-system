$kind: http-request
url: "{{baseUrl}}/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}",
      "fullName": "{{fullName}}",
      "phone": "{{phone}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Register response received", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201, 400, 409]); });
    language: text/javascript
order: 1000
