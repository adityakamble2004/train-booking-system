$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Idempotency-Key: negative-class-2A
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "trainNo": "{{trainNo}}",
      "journeyDate": "{{journeyDate}}",
      "fromStation": "{{fromStation}}",
      "toStation": "{{toStation}}",
      "classCode": "2A",
      "contactEmail": "{{email}}",
      "contactPhone": "{{phone}}",
      "passengers": [
        {
          "name": "{{fullName}}",
          "dateOfBirth": "2001-08-14",
          "gender": "M",
          "berthPreference": "LOWER"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Expected class unavailable response", function () { pm.expect(pm.response.code).to.eql(404); });
    language: text/javascript
order: 2000
