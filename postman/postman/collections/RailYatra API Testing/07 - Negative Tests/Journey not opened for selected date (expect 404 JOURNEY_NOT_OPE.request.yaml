$kind: http-request
name: Journey not opened for selected date (expect 404 JOURNEY_NOT_OPEN)
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Idempotency-Key: negative-date-01
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "trainNo": "{{trainNo}}",
      "journeyDate": "2026-12-31",
      "fromStation": "{{fromStation}}",
      "toStation": "{{toStation}}",
      "classCode": "{{classCode}}",
      "contactEmail": "{{email}}",
      "contactPhone": "{{phone}}",
      "passengers": [
        {
          "name": "{{fullName}}",
          "dateOfBirth": "2001-08-14",
          "gender": "M",
          "berthPreference": "LOWER"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Expected journey not opened response", function () { pm.expect(pm.response.code).to.eql(404); });
    language: text/javascript
order: 5000
