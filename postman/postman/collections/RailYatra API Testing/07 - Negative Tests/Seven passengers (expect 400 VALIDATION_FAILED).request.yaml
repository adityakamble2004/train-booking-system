  content: |-
    {
      "trainNo": "{{trainNo}}",
      "journeyDate": "{{journeyDate}}",
      "fromStation": "{{fromStation}}",
      "toStation": "{{toStation}}",
      "classCode": "{{classCode}}",
      "contactEmail": "{{email}}",
      "contactPhone": "{{phone}}",
      "passengers": [
        {
          "name": "Passenger 1",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 2",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 3",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 4",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 5",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 6",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        },
        {
          "name": "Passenger 7",
          "dateOfBirth": "2000-01-01",
          "gender": "M",
          "berthPreference": "UPPER"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Expected passenger-count validation response", function () { pm.expect(pm.response.code).to.eql(400); });
    language: text/javascript
order: 4000
