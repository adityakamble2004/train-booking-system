$kind: http-request
url: "{{baseUrl}}/users/me/passengers"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Asha Kamble",
      "dateOfBirth": "1975-03-02",
      "gender": "F",
      "berthPreference": "LOWER",
      "idType": "AADHAAR",
      "idLast4": "1234"
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Passenger created or validation response", function () { pm.expect(pm.response.code).to.be.oneOf([200, 201, 400, 401]); });
      let j={}; try{j=pm.response.json()}catch(e){}; if(j.id) pm.collectionVariables.set("passengerId", String(j.id));
    language: text/javascript
order: 2000
