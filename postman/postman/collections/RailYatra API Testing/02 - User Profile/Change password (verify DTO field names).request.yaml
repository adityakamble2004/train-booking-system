$kind: http-request
url: "{{baseUrl}}/users/me/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{password}}",
      "newPassword": "Test1234"
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
order: 3000
