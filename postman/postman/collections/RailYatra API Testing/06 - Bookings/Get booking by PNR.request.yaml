$kind: http-request
url: "{{baseUrl}}/bookings/{{pnr}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Booking lookup", function () { pm.expect(pm.response.code).to.be.oneOf([200, 401, 404]); });
    language: text/javascript
order: 3000
