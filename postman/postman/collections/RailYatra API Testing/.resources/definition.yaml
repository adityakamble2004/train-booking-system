$kind: collection
description: Postman collection for testing RailYatra authentication, user profile/passengers, admin journey setup, availability, and booking APIs. Set the collection variables before running. Admin journey creation may require trainNo as a query parameter as well as in the JSON body, depending on the current controller configuration.
variables:
  - key: baseUrl
    value: http://localhost:8081/api/v1
    disabled: false
  - key: publicBaseUrl
    value: http://localhost:8080
    disabled: false
  - key: userToken
    secret: true
    disabled: false
  - key: adminToken
    value: ""
    disabled: false
  - key: otherUserToken
    value: ""
    disabled: false
  - key: email
    value: aditya@example.com
    disabled: false
  - key: password
    value: Test1234
    disabled: false
  - key: fullName
    value: Aditya Kamble
    disabled: false
  - key: phone
    value: "9876543210"
    disabled: false
  - key: trainNo
    value: "01488"
    disabled: false
  - key: journeyDate
    value: 2026-10-28
    disabled: false
  - key: fromStation
    value: HGL
    disabled: false
  - key: toStation
    value: KWV
    disabled: false
  - key: classCode
    value: SL
    disabled: false
  - key: pnr
    value: ""
    disabled: false
  - key: idempotencyKey
    value: test-0001
    disabled: false
  - key: passengerId
    value: ""
    disabled: false
  - key: nextStation
    value: PUNE
    disabled: false
