$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login successful", function(){pm.expect(pm.response.code).to.be.oneOf([200,201]);});
      let j={}; try{j=pm.response.json()}catch(e){}
      const t=j.accessToken||j.token||(j.data&&(j.data.accessToken||j.data.token));
      if(t) pm.collectionVariables.set("userToken",t);
    language: text/javascript
order: 2000
