$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Idempotency-Key: "{{idempotencyKey}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "trainNo": "{{trainNo}}",
      "journeyDate": "{{journeyDate}}",
      "fromStation": "{{fromStation}}",
      "toStation": "{{toStation}}",
      "classCode": "{{classCode}}",
      "contactEmail": "{{email}}",
      "contactPhone": "{{phone}}",
      "passengers": [
        {
          "name": "{{fullName}}",
          "dateOfBirth": "2001-08-14",
          "gender": "M",
          "berthPreference": "LOWER"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
order: 2000
