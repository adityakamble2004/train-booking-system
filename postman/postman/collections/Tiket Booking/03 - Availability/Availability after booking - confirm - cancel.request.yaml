$kind: http-request
name: Availability after booking / confirm / cancel
url: "{{baseUrl}}/availability?trainNo={{trainNo}}&date={{journeyDate}}&from={{fromStation}}&to={{toStation}}"
method: GET
queryParams:
  trainNo: "{{trainNo}}"
  date: "{{journeyDate}}"
  from: "{{fromStation}}"
  to: "{{toStation}}"
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
order: 2000
