$kind: http-request
url: "{{baseUrl}}/bookings"
method: POST
headers:
  Content-Type: application/json
  Idempotency-Key: "{{idempotencyKey}}"
body:
  type: json
  content: |-
    {
      "trainNo": "01488",
      "journeyDate": "2026-10-25",
      "fromStation": "HGL",
      "toStation": "KWV",
      "classCode": "SL",
      "contactEmail": "{{email}}",
      "contactPhone": "9876543210",
      "passengers": [
        {
          "name": "Aditya Kamble",
          "dateOfBirth": "2001-08-14",
          "gender": "M",
          "berthPreference": "LOWER"
        }
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Booking created', function () {
        pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });
      if ([200, 201].includes(pm.response.code)) {
        const data = pm.response.json();
        const pnr = data.pnr || (data.data && data.data.pnr);
        if (pnr) pm.environment.set('pnr', pnr);
      }
    language: text/javascript
order: 1000
