$kind: http-request
url: "{{baseUrl}}/bookings/{{pnr}}/payments"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Expired booking returns 410', function () {
        pm.response.to.have.status(410);
      });
    language: text/javascript
order: 1000
