$kind: http-request
url: "{{baseUrl}}/payments/webhook"
method: POST
headers:
  Content-Type: application/json
  X-Signature: invalid-signature
body:
  type: json
  content: "{{webhookBody}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Invalid signature rejected', function () {
        pm.response.to.have.status(401);
      });
    language: text/javascript
order: 1000
