$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login successful', function () {
        pm.response.to.have.status(200);
      });
      const data = pm.response.json();
      if (data.accessToken) {
        pm.environment.set('userToken', data.accessToken);
      } else if (data.data && data.data.accessToken) {
        pm.environment.set('userToken', data.data.accessToken);
      }
    language: text/javascript
order: 2000
