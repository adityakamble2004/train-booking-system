$kind: http-request
name: Search - same station -> 400
url: "{{baseUrl}}/api/v1/trains/search?from=HGL&to=hgl"
method: GET
queryParams:
  from: HGL
  to: hgl
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", function () { pm.response.to.have.status(400); });
      pm.test("Error code is SAME_STATION", function () { pm.expect(pm.response.json().code).to.eql("SAME_STATION"); });
    language: text/javascript
order: 4000
