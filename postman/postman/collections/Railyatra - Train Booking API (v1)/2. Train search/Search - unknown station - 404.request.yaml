$kind: http-request
name: Search - unknown station -> 404
url: "{{baseUrl}}/api/v1/trains/search?from=ZZZZ&to=KWV"
method: GET
queryParams:
  from: ZZZZ
  to: KWV
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", function () { pm.response.to.have.status(404); });
      pm.test("Error code is STATION_NOT_FOUND", function () { pm.expect(pm.response.json().code).to.eql("STATION_NOT_FOUND"); });
    language: text/javascript
order: 5000
